[package]
name = "nilperit-writer"
description = "Chunking, packs, commits, retention and sweep for a NilPerit vault"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
nilperit-reader.workspace = true
nilperit-format.workspace = true
nilperit-crypto.workspace = true
blake3 = { version = "1", default-features = false }
miniz_oxide = { version = "0.9", default-features = false, features = ["with-alloc"] }

[dev-dependencies]
# Only for the random number generator of the tests.
x-wing = { version = "0.1.1", default-features = false, features = ["zeroize"] }

[lints]
workspace = true
