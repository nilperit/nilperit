[package]
name = "nilperit-fuzz"
description = "The checks that the mutation tests and the fuzzers of NilPerit run on bytes that are not trusted"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
nilperit-format.workspace = true
nilperit-crypto.workspace = true
nilperit-reader.workspace = true
nilperit-writer.workspace = true
blake3 = { version = "1", default-features = false }
minicbor = { version = "2.3.1", default-features = false, features = ["alloc"] }
miniz_oxide = { version = "0.9", default-features = false, features = ["with-alloc"] }
rand_core = { version = "0.10", default-features = false }

[lints]
workspace = true
