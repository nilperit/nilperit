[package]
name = "nilperit-crypto"
description = "Key derivation, sealing and AEAD for the NilPerit vault"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
blake3 = { version = "1", default-features = false }
zeroize = { version = "1", default-features = false, features = ["alloc"] }
x-wing = { version = "0.1.1", default-features = false, features = ["zeroize"] }
chacha20poly1305 = { version = "0.11", default-features = false, features = ["alloc", "zeroize"] }
bip39 = { version = "3", default-features = false, features = ["alloc", "zeroize"] }

[lints]
workspace = true
