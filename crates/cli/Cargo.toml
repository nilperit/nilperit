[package]
name = "nilperit-cli"
description = "The nilperit program: a personal backup into an encrypted, versioned, deduplicated vault"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
name = "nilperit_cli"
path = "src/lib.rs"

[[bin]]
name = "nilperit"
path = "src/main.rs"

[dependencies]
nilperit-format.workspace = true
nilperit-crypto.workspace = true
nilperit-reader.workspace = true
nilperit-writer.workspace = true
nilperit-target-fs.workspace = true
nilperit-connector-fs.workspace = true
clap = { version = "4", default-features = false, features = ["std", "help", "usage", "error-context", "derive"] }
getrandom = { version = "0.4", default-features = false, features = ["sys_rng"] }
rand_core = { version = "0.10", default-features = false }
zeroize = { version = "1", default-features = false, features = ["alloc"] }

[lints]
workspace = true
