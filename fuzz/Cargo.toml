# The coverage-guided fuzz targets of NilPerit, for `cargo-fuzz` (libFuzzer).
#
# This is not part of the workspace of the repository: it needs a nightly toolchain (see
# `rust-toolchain.toml`), and libFuzzer is a build tool, not code that ships. Every target
# calls one check of the crate `nilperit-fuzz`, the same checks that the mutation tests run.
# See README.md in this folder.

[package]
name = "nilperit-fuzz-targets"
version = "0.0.0"
edition = "2024"
publish = false
license = "MIT"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
nilperit-fuzz = { path = "../crates/fuzz" }

# A workspace of its own, so that cargo does not take this folder for a member of the one
# of the repository.
[workspace]

[[bin]]
name = "canonical"
path = "fuzz_targets/canonical.rs"
test = false
doc = false
bench = false

[[bin]]
name = "envelope"
path = "fuzz_targets/envelope.rs"
test = false
doc = false
