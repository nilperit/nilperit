name: Rust checks

on:
  pull_request:
  # Required for the merge queue: checks must also run on merge groups.
  merge_group:

permissions: {}

# A new push to the same pull request cancels the run that is still going.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # rustup reads rust-toolchain.toml and installs the pinned toolchain,
      # its components and the wasm32 target on the first cargo command.
      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Build the reader side for wasm32
        run: >
          cargo check --locked --target wasm32-unknown-unknown
          -p nilperit-format -p nilperit-crypto -p nilperit-reader

      - name: Check crate layering
        run: scripts/check-layering.sh

  # The tests, on each system that the program runs on. The systems have other rules: the
  # separator of a path, the names that a file cannot have, files that cannot be replaced
  # while another program has them open, and the permission bits. Each system is a check of
  # its own with a fixed name (`test-linux`, `test-windows`, `test-macos`), so that each can
  # be required in the rules of the repository. Format, clippy, the wasm32 build and the
  # layering check do not depend on the system, and run once, in the job `rust`.
  test:
    name: test-${{ matrix.system }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      # A system that fails does not cancel the others: one run shows all the failures.
      fail-fast: false
      matrix:
        include:
          # Fixed versions, so that a new image does not change the result by surprise.
          - system: linux
            runner: ubuntu-26.04
          - system: windows
            runner: windows-2025
          - system: macos
            runner: macos-15
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # rustup reads rust-toolchain.toml and installs the pinned toolchain on the first
      # cargo command. `--no-fail-fast` runs every test suite, so that one run shows all
      # the failures and not only the first suite that fails.
      - name: Test
        run: cargo test --workspace --locked --no-fail-fast

  deny:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The action runs in a container with its own Rust. cargo-deny only reads
      # Cargo.lock, so it does not need our pinned toolchain. Without this step,
      # rustup in the container downloads that toolchain on every run and prints
      # an "override toolchain is not installed" error before it continues.
      - name: Use the toolchain of the action image
        run: rm rust-toolchain.toml

      # Published by the cargo-deny maintainers. Dependabot keeps the pin current.
      - name: Check advisories, licenses, bans and sources
        uses: EmbarkStudios/cargo-deny-action@17aeb3c839e42274e2b8adf721c8c65edfdc74dd # v2.1.3
        with:
          command: check
          arguments: --locked
