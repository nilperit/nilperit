name: Main commit style

# Detects commits on main that do not follow Conventional Commits, for example
# when someone edits the message at merge time. It cannot undo a merge; a red
# run on main makes the deviation visible. Keep the pattern in sync with
# pr-title.yml.

on:
  push:
    branches: [main]

permissions: {}

jobs:
  conventional-commit:
    runs-on: ubuntu-24.04
    steps:
      - name: Check the subject of the pushed commit
        env:
          MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          subject="${MESSAGE%%$'\n'*}"
          re='^(feat|fix|docs|chore|refactor|test|ci)(\([a-z0-9._-]+\))?!?: .+'
          if [[ ! "$subject" =~ $re ]]; then
            echo "::error::Commit subject is not a Conventional Commit: $subject"
            exit 1
          fi
