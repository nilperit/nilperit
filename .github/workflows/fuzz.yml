name: Fuzz

# Coverage-guided fuzzing with cargo-fuzz (libFuzzer), on a nightly toolchain. Each target runs
# one check of the crate `nilperit-fuzz`, the same checks that the mutation tests run in
# `Rust checks`. See `fuzz/README.md`.
#
# - Every Sunday: each target runs for 10 minutes, and keeps its corpus for the next week.
# - By hand: the same, with the time that you give.
# - For a pull request that changes the fuzz targets, the checks, or this file: 30 seconds for
#   each target, to see that they still build and run.
#
# This workflow is not a required check: a run does not find a problem every time, and a run for
# a pull request only happens when a path above changes.

on:
  schedule:
    # Sunday, 03:17 UTC.
    - cron: "17 3 * * 0"
  workflow_dispatch:
    inputs:
      seconds:
        description: Seconds to fuzz each target
        required: false
        default: "600"
  pull_request:
    paths:
      - "fuzz/**"
      - "crates/fuzz/**"
      - ".github/workflows/fuzz.yml"

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_FUZZ_VERSION: "0.13.2"

jobs:
  fuzz:
    name: fuzz-${{ matrix.target }}
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      # A target that fails does not stop the others.
      fail-fast: false
      matrix:
        # One target for each check of `nilperit-fuzz`. A test checks that this list is complete.
        target:
          - canonical
          - envelope
          - content_object
          - item_record
          - delta_entry
          - snapshot_header
          - vault_config
          - lock_file
          - object_table
          - pack_parts
          - pack_with_table
          - pack_with_object
          - encryption
          - chunker
    env:
      TARGET: ${{ matrix.target }}
      # 30 seconds for a pull request, the input for a run by hand, and 10 minutes otherwise.
      FUZZ_SECONDS: ${{ github.event_name == 'pull_request' && '30' || inputs.seconds || '600' }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The input of a run by hand is text. It goes through an environment variable, and it must
      # be a number.
      - name: Check the time to fuzz
        run: |
          case "$FUZZ_SECONDS" in
            ''|*[!0-9]*) echo "The time to fuzz is not a number."; exit 1 ;;
          esac

      - name: Restore cargo-fuzz
        id: cargo-fuzz
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/cargo-fuzz
          key: cargo-fuzz-${{ env.CARGO_FUZZ_VERSION }}-${{ runner.os }}

      - name: Install cargo-fuzz
        if: steps.cargo-fuzz.outputs.cache-hit != 'true'
        run: cargo install cargo-fuzz --locked --version "$CARGO_FUZZ_VERSION"

      - name: Keep cargo-fuzz
        if: steps.cargo-fuzz.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/cargo-fuzz
          key: cargo-fuzz-${{ env.CARGO_FUZZ_VERSION }}-${{ runner.os }}

      # The corpus of the last run: what the fuzzer found that reaches new code.
      - name: Restore the corpus
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: fuzz/corpus/${{ matrix.target }}
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}
          restore-keys: |
            fuzz-corpus-${{ matrix.target }}-

      # Valid input of every kind, made from the encoders and the test vectors. The fuzzer starts
      # from it, and so it gets past the first checks at once.
      - name: Add the seeds to the corpus
        run: cargo run --locked -p nilperit-fuzz --bin seed-corpus -- fuzz/corpus

      # The nightly toolchain of the folder `fuzz` (`fuzz/rust-toolchain.toml`) is installed by
      # rustup on the first cargo command.
      - name: Fuzz
        working-directory: fuzz
        run: >
          cargo fuzz run "$TARGET" --
          -max_total_time="$FUZZ_SECONDS" -max_len=65536 -rss_limit_mb=2048 -timeout=20
          -print_final_stats=1

      - name: Keep the corpus
        if: always()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: fuzz/corpus/${{ matrix.target }}
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}

      - name: Keep the input that made the target fail
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-artifacts-${{ matrix.target }}
          path: fuzz/artifacts/${{ matrix.target }}
          if-no-files-found: ignore
          retention-days: 90

      - name: Say how to run the failure again
        if: failure()
        run: |
          {
            echo "### The target \`$TARGET\` failed"
            echo
            echo "Download the artifact \`fuzz-artifacts-$TARGET\` of this run. It has the input."
            echo "Run it again with \`cd fuzz && cargo fuzz run $TARGET artifacts/$TARGET/<file>\`."
            echo "When the problem is fixed, copy the file to \`crates/fuzz/regressions/$TARGET/\`."
            echo "See \`crates/fuzz/regressions/README.md\`."
          } >> "$GITHUB_STEP_SUMMARY"
